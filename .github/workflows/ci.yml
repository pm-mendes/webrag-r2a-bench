name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      # The schema-vs-kit test skips here: the kit lives in the Overleaf project.
      - run: uv run pytest -q --cov --cov-report=term

  dry-run:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run webrag-bench run config/plans/dry-run.yaml --workers 2
      - run: uv run webrag-bench run config/plans/y-dry-run.yaml --workers 2
      - name: campaign plans must stay refused until the freeze
        run: |
          set +e
          for plan in campaign-p campaign-y; do
            uv run webrag-bench freeze-check config/plans/$plan.yaml
            test $? -eq 3 || exit 1
          done
