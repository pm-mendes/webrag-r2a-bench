<main><h1>Recette du gratin dauphinois</h1>
<p>Émincez un kilo de pommes de terre, frottez le plat à l'ail, versez la crème et le lait.</p><p>Faites cuire une heure à cent cinquante degrés. Servez chaud.</p>
