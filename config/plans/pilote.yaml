# PILOTE — remplace l'hypothèse de 42 s/épisode par une médiane mesurée.
# À compléter par Pedro : les quatre générateurs de P (et les deux de Y) avec leur
# identifiant de version exact, les points d'accès et les variables des clés.
# Tant qu'un PENDING subsiste, les appels échouent : rien n'est substitué en silence.
nom: pilote
statut: PILOTE
sel_canari: pilote-v1
corpus: corpus
config_attaques: config/demo/attaques
config_taches: config/demo/taches
top_k: 3
alpha_hybride: 0.5
embedder:
  type: openai-compatible
  base_url: "PENDING — embedder sur la machine OVH, p. ex. http://<hote-ovh>:8001/v1"
  modele: "PENDING"
generateurs:
  - {nom: G1, type: openai-compatible, id_version: "PENDING", base_url: "PENDING", cle_env: WEBRAG_CLE_G1}
  - {nom: G2, type: openai-compatible, id_version: "PENDING", base_url: "PENDING", cle_env: WEBRAG_CLE_G2}
  - {nom: G3, type: openai-compatible, id_version: "PENDING", base_url: "PENDING", cle_env: WEBRAG_CLE_G3}
  - {nom: G4-8B-OVH, type: openai-compatible, id_version: "PENDING", base_url: "PENDING — vLLM OVH"}
facteurs:
  taches: toutes
  familles: [F1, F2]
  defenses: [aucune]
  generateurs: [G1, G2, G3, G4-8B-OVH]
  index: [hybride]
  lecteurs: [bs4-texte]
  repetitions: 2
