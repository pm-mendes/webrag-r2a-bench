[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webrag-r2a-bench"
version = "0.1.0.dev0"
description = "Staged measurement bench for retrieval-to-action prompt injection in web-native agentic RAG"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pedro Mendes" }]
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.2,<3",
  "rank-bm25>=0.2",
  "numpy>=1.26",
  "jsonschema>=4.20",
  "warcio>=1.7",
  "beautifulsoup4>=4.12",
  "html2text>=2024.2",
  "trafilatura>=1.9",
  "pyyaml>=6.0",
  "pydantic>=2.13.5",
  "cryptography>=43",
]

[project.scripts]
webrag-bench = "webrag_bench.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.20",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "PTH", "C4", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]  # non-ASCII in strings/docstrings is intended (⊆, ×, é)

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rank_bm25", "warcio.*", "html2text", "trafilatura"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["webrag_bench"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
