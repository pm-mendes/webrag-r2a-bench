# Répétition à blanc exigée avant le gel : 5 tâches × 2 conditions.
# Générateur et embedder FACTICES : elle vérifie le câblage, elle ne mesure rien.
nom: repetition-a-blanc
statut: DEMO
sel_canari: repetition-a-blanc-v1
corpus: corpus
config_attaques: config/demo/attaques
config_taches: config/demo/taches
top_k: 3
alpha_hybride: 0.5
embedder: {type: factice}
generateurs:
  - {nom: factice, type: factice, id_version: factice-0}
facteurs:
  taches: toutes
  familles: [F1]
  defenses: [aucune, garde-outils-squelette]
  generateurs: [factice]
  index: [bm25]
  lecteurs: [bs4-texte]
  repetitions: 1
